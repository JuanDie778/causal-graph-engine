<!DOCTYPE html>
<html lang="es">
<head>

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    #sidebar {
      width: 380px;
      background: #1e293b;
      border-right: 1px solid #334155;
      padding: 20px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    #viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle, #1e293b 10%, #0f172a 90%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 16px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-u { background: #0284c7; color: white; }
    .badge-x { background: #16a34a; color: white; }
    .badge-v { background: #d97706; color: white; }
    .badge-j { background: #9333ea; color: white; }
    .badge-alert { background: #dc2626; color: white; }
    .node-card {
      background: #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .node-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .node-card.selected {
      border-color: #38bdf8;
      background: #1e3a5f;
    }
    pre {
      background: #090d16;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      overflow-x: auto;
      color: #38bdf8;
    }
  </style>
</head>
