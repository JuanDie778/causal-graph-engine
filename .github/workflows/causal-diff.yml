name: ActorDB Causal Diff & Invariant Audit

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - ".github/workflows/causal-diff.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: causal-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causal-diff-audit:
    name: Causal Diff (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: golden-case
            subpath: golden_case
            report_prefix: golden_case
          - name: saas-governed
            subpath: examples/saas_governed
            report_prefix: saas_governed
          - name: saas-zero-config
            subpath: examples/saas_unit_economics
            report_prefix: saas_zero_config

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Git refs for Causal Diff
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            echo "base=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
            echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
            else
              echo "base=HEAD" >> "$GITHUB_OUTPUT"
            fi
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ActorDB / CGE dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          else
            pip install numpy scipy sympy networkx pandas jsonschema pyyaml "mcp>=1.0,<2.0"
          fi

      - name: Run Causal Diff Check (JSON + Markdown)
        id: causal_diff
        shell: bash
        env:
          BASE_REF: ${{ steps.refs.outputs.base }}
          HEAD_REF: ${{ steps.refs.outputs.head }}
          SUBPATH: ${{ matrix.target.subpath }}
          PREFIX: ${{ matrix.target.report_prefix }}
        run: |
          mkdir -p causal_diff_reports
          EFFECTIVE_BASE="$BASE_REF"
          if [ -n "$SUBPATH" ] && [ "$SUBPATH" != "." ]; then
            if ! git cat-file -e "${BASE_REF}:${SUBPATH}" 2>/dev/null; then
              echo "Subpath '${SUBPATH}' is newly introduced in ${HEAD_REF}; auditing ${HEAD_REF} baseline."
              EFFECTIVE_BASE="$HEAD_REF"
            fi
          fi
          set +e
          python -m cge.diff \
            --git-repo . \
            --base-ref "$EFFECTIVE_BASE" \
            --head-ref "$HEAD_REF" \
            --subpath "$SUBPATH" \
            --format json \
            --check > "causal_diff_reports/${PREFIX}_diff.json"
          DIFF_EXIT=$?
          set -e
          echo "exit_code=${DIFF_EXIT}" >> "$GITHUB_OUTPUT"
          if [ ! -s "causal_diff_reports/${PREFIX}_diff.json" ] || [ "$DIFF_EXIT" -ge 2 ]; then
            echo "ERROR: cge.diff failed to produce a valid JSON report (exit=${DIFF_EXIT})" >&2
            exit 1
          fi
          python -m cge.diff \
            --git-repo . \
            --base-ref "$EFFECTIVE_BASE" \
            --head-ref "$HEAD_REF" \
            --subpath "$SUBPATH" \
            --format markdown > "causal_diff_reports/${PREFIX}_diff.md"

      - name: Publish Step Summary
        if: always()
        shell: bash
        run: |
          if [ -f "causal_diff_reports/${{ matrix.target.report_prefix }}_diff.md" ]; then
            cat "causal_diff_reports/${{ matrix.target.report_prefix }}_diff.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Causal Diff report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-diff-${{ matrix.target.name }}
          path: causal_diff_reports/
          retention-days: 14

      - name: Post sticky PR comment
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const targetName = '${{ matrix.target.name }}';
            const prefix = '${{ matrix.target.report_prefix }}';
            const marker = `<!-- actordb-causal-diff:${targetName} -->`;
            const mdPath = `causal_diff_reports/${prefix}_diff.md`;
            const rawMd = fs.existsSync(mdPath) ? fs.readFileSync(mdPath, 'utf8') : '';
            const bodyContent = rawMd.trim().length > 0
              ? rawMd
              : `_Causal Diff operational error for \`${targetName}\` — inspect workflow job logs._`;
            const fullBody = `${marker}\n${bodyContent}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Ratify Causal Diff Invariants & Regressions
        shell: bash
        env:
          DIFF_EXIT: ${{ steps.causal_diff.outputs.exit_code }}
          REPORT_PATH: causal_diff_reports/${{ matrix.target.report_prefix }}_diff.json
        run: |
          python - << 'PY'
          import json
          import os
          import sys

          report_path = os.environ["REPORT_PATH"]
          diff_exit = int(os.environ.get("DIFF_EXIT", "1"))
          if not os.path.exists(report_path) or os.path.getsize(report_path) == 0:
              print(f"ERROR: Missing or empty Causal Diff report at {report_path}", file=sys.stderr)
              sys.exit(1)

          with open(report_path, "r", encoding="utf-8") as fh:
              report = json.load(fh)

          critical_items = [
              item
              for sec in ("invariant_regressions", "diagnostics")
              for item in report.get(sec, [])
              if item.get("severity") == "critical"
          ]
          if critical_items or diff_exit != 0:
              print(f"Causal Diff blocked PR ({len(critical_items)} critical findings, exit={diff_exit}):")
              for item in critical_items:
                  print(" -", item.get("code", item.get("constraint_id")), item.get("message", ""))
              sys.exit(1)

          print(f"Causal Diff passed cleanly: summary={json.dumps(report.get('summary', {}))}")
          PY
